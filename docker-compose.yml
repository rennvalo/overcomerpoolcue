services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: overcomer-poolcue
    container_name: overcomer-poolcue
    ports:
      - "8432:8432"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: overcomer-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    env_file:
      - .env
